name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint check when TypeScript sources exist
        run: |
          if find src apps libs test -type f -name '*.ts' -print -quit 2>/dev/null | grep -q .; then
            npm run lint:check
          else
            echo "::notice::Skipping lint: no TypeScript files found in src/, apps/, libs/, or test/."
          fi

  database-migrations:
    name: Fresh database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartlearning_ci
          POSTGRES_USER: smartlearning_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartlearning_ci -d smartlearning_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://smartlearning_ci:ci-only-password@localhost:5432/smartlearning_ci?schema=app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the fresh database
        run: npx prisma migrate deploy --config prisma.ci.config.ts

      - name: Save successful migration result
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { Client } = require('pg');

          async function main() {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            try {
              const { rows } = await client.query(
                'SELECT current_setting(\'server_version\') AS postgres_version, migration_name FROM app._prisma_migrations WHERE rolled_back_at IS NULL AND finished_at IS NOT NULL ORDER BY started_at, migration_name',
              );
              const migrations = rows.map(({ migration_name }) => migration_name);
              if (migrations.length === 0) {
                throw new Error('No successfully applied migrations were found');
              }

              const outputPath = path.join(process.env.RUNNER_TEMP, 'migration-result.json');
              fs.writeFileSync(
                outputPath,
                `${JSON.stringify(
                  {
                    result: 'success',
                    completed_at: new Date().toISOString(),
                    commit_sha: process.env.GITHUB_SHA,
                    workflow_run_id: process.env.GITHUB_RUN_ID,
                    workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
                    postgres_version: rows[0].postgres_version,
                    applied_migrations: migrations,
                  },
                  null,
                  2,
                )}\n`,
              );
            } finally {
              await client.end();
            }
          }

          main().catch((error) => {
            console.error('Could not create the migration success record:', error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Upload successful migration result
        uses: actions/upload-artifact@v4
        with:
          name: fresh-database-migration-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/migration-result.json
          if-no-files-found: error
          retention-days: 14

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate OpenAPI document
        run: npm run openapi:export

      - name: Verify OpenAPI can generate TypeScript client types
        run: npm run openapi:client:check

      - name: Check API names against curated glossary rules
        run: npm run openapi:names:check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests when specs exist
        run: |
          if find src -type f -name '*.spec.ts' -print -quit 2>/dev/null | grep -q .; then
            npm test -- --runInBand
          else
            echo "::notice::Skipping unit tests: no *.spec.ts files found under src/."
          fi

worker_processes 1;

events {
  worker_connections 256;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream smartlearning_api {
    # Engine.IO polling creates server-local sessions before upgrading; keep
    # those requests on one API instance while Redis shares application events.
    ip_hash;
    server api-a:3000;
    server api-b:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;
    return 308 https://$host:8443$request_uri;
  }

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;
    error_log /dev/stderr warn;

    # Metrics is intentionally not proxied. Scrape the API only from the
    # internal monitoring network or localhost on a deployment-specific path.
    location = /metrics {
      return 404;
    }

    location /socket.io/ {
      proxy_pass http://smartlearning_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-User '';
      proxy_set_header X-Account-Id '';
      proxy_set_header X-Role '';
      proxy_set_header X-Participant-Id '';
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_connect_timeout 5s;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://smartlearning_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-User '';
      proxy_set_header X-Account-Id '';
      proxy_set_header X-Role '';
      proxy_set_header X-Participant-Id '';
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_connect_timeout 5s;
    }
  }
}

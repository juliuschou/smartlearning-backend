global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/smartlearning-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager-rehearsal:9093']

scrape_configs:
  - job_name: smartlearning-backend
    static_configs:
      - targets: ['host.docker.internal:3001']
